[project]
name = "scalilaw-data"
version = "0.1.0"
description = "WandB extraction pipeline producing clean, versioned Pythia/PolyPythias training-loss datasets for scaling-law error analysis."
authors = [
    { name = "mgarciav88", email = "miguelgarciavera88@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "wandb>=0.19",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "huggingface-hub>=0.27",
]

[project.scripts]
scalilaw-data = "scalilaw_data.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real WandB API (requires WANDB_API_KEY); skipped by default",
]
addopts = "-m 'not live'"